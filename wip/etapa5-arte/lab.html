<!doctype html><meta charset="utf-8"><body style="margin:0;background:#3c7a3a">
<canvas id="o"></canvas>
<script src="kit.js"></script>
<script>
function h2(x, y){ let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
</script>
<script src="sprites5.js"></script>
<script src="skel.js"></script>
<script>
const Z = +(new URLSearchParams(location.search).get('z') || 4);
const o = document.getElementById('o'); o.width = 1400; o.height = 900; const g = o.getContext('2d'); g.imageSmoothingEnabled = false;
g.fillStyle = '#4a8a3a'; g.fillRect(0, 0, o.width, o.height);
let X = 8, Y = 8, rowH = 0;
function put(c, label){ if (X + c.width*Z > o.width){ X = 8; Y += rowH + 18; rowH = 0; }
  g.drawImage(c, X, Y, c.width*Z, c.height*Z); g.fillStyle = '#fff'; g.font = '11px monospace'; g.fillText(label, X, Y + c.height*Z + 12);
  X += c.width*Z + 10; rowH = Math.max(rowH, c.height*Z); }
const SW = greatswordBase();
for (const [pose, f] of [['walk',0],['walk',1],['walk',2],['walk',3],['brace',0],['raise',0],['crouch',0],['spin',0]]){
  const c = paladinBody(pose, f), d = cnv(c.width, c.height), q = d.getContext('2d');
  q.drawImage(c, 0, 0);
  const H = PAL_HAND[pose]; q.save(); q.translate(H[0], H[1] + (pose==='walk' && (f===1||f===3) ? 1 : 0)); q.rotate(pose==='raise' ? -2.2 : pose==='crouch' ? 1.57 : pose==='brace' ? 2.6 : 1.9); q.drawImage(SW, -6, -5); q.restore();
  q.fillStyle = '#e8ffd0'; q.fillRect(20, 12 + (pose==='brace'?3:pose==='crouch'?4:0), 2, 1); q.fillRect(25, 12 + (pose==='brace'?3:pose==='crouch'?4:0), 2, 1);
  put(d, pose + f);
}
put(SW, 'sword'); put(spiritSprite(0), 'spirit0'); put(spiritSprite(1), 'spirit1'); put(ghostBladeBase(), 'blade');
for (const [pose, f] of [['float',0],['float',1],['float',2],['float',3],['cast',0],['tired',0]]) put(lichBody(pose, f), pose + f);
const S = buildGrid(SKEL_DEF);
for (const dir of ['down','up','side','left']) for (let f = 0; f < 4; f++) put(S[dir][f], dir[0] + f);
</script>
